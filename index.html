<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ちいかわの街</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-wrapper">
      <div class="hud">
        <h1>ちいかわの街</h1>
        <div class="mini-help">
          「あなた」の操作：<br>
          <span style="margin-left: 1em;">PC：矢印キー</span><br>
          <span style="margin-left: 1em;">スマホ：ドラッグ＆ドロップ</span>
        </div>
      </div>

      <div class="game-area" id="game-area">
        <div class="map" id="map">
          <div class="world" id="world">
            <div class="player" id="player" aria-label="プレイヤー"></div>
          </div>
        </div>
      </div>

      <div class="dialog" id="dialog-box">
        <div class="dialog-title">街の人</div>
        <div id="dialog-text">街に来たよ！何か見つけるかな？</div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
